version: 1
disable_existing_loggers: False
formatters:
  # build_formatter picks JSON on edge/staging/prod and keeps the text format
  # below on dev/testing. See data_access_service/utils/log_formatter.py
  default:
    "()": data_access_service.utils.log_formatter.build_formatter
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  access:
    "()": data_access_service.utils.log_formatter.build_formatter
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
handlers:
  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr
  access:
    formatter: access
    class: logging.StreamHandler
    stream: ext://sys.stdout
loggers:
  uvicorn.error:
    level: INFO
    handlers:
      - default
    propagate: no
  uvicorn.access:
    level: INFO
    handlers:
      - access
    propagate: no
  botocore:
    level: INFO
    propagate: no
  s3fs:
    level: INFO
    propagate: no
  aiobotocore:
    level: INFO
    propagate: no
root:
  level: DEBUG
  handlers:
    - default
  propagate: no
