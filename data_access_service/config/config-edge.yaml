csiro:
  datasets:
    - dataset_name: uwy_csiro.parquet
      key_request_url: https://data.csiro.au/dap/api/v2/collections/72626/files/s3
aws:
  s3:
    bucket_name:
      subsetting: aodn-cloud-optimized-subset-edge
      portal_data: aodnportal-edge-data
      wave_buoy_backup: datavis-apps-edge-data
      mooring_backup: datavis-apps-edge-data
  ses:
    sender_email: no.reply@aodn.org.au
  batch:
    job_queue: data-access-service-batch-job-queue
    job_definition: data-access-service-batch-job-definition
pmtiles:
  config:
    use_fork_process: True
tiler:
  config:
    # Capacity gate for concurrent store opens during startup prewarm.
    store_prewarm_workers: 8
    # Bounded pool for TTL-triggered background store refreshes.
    store_refresh_workers: 2
    # Max concurrent sync route handlers (each cold slice needs one thread).
    thread_pool_size: 8
    # Capacity gate for /animation per-frame S3 fan-out. Sized to the aiobotocore
    animation_workers: 4
