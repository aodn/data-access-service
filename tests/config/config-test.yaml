aws:
  s3:
    bucket_name:
      subsetting: test-bucket
      portal_data: apps-test-data
      datavis_data: test-site-snapshot-bucket
  ses:
    sender_email: no.reply@aodn.org.au
  batch:
    job_queue: generate-csv-data-file-test
    job_definition: generate-csv-data-file-test
pmtiles:
  config:
    # Temporal bucket for hexbin counts: "month" (YYYYMM) or "date" (YYYYMMDD).
    time_group_by: month
sites:
  config:
    duckdb_database: ":memory:"
    threads: 8
subsetting:
  config:
    # Fixed ceiling for the chunk-size tests. Base config.yaml may use a
    # different max_chunk_gb; pytest loads this overlay.
    max_chunk_gb: 4
