# Order of values under each key matters, do not change it. For example, _temporal_extent should be before the timestamp.
# because seagrass dataset has _temporal_extent column, it will be used for time range query, instead of timestamp which
# is hive column
column_name_mapping:
  time:
    - TIME
    - time
    - JULD
    - eventDate
    - detection_timestamp
    - detection_datetime
    - _temporal_extent
    # Prefer a real datetime over the hive partition named "timestamp",
    # which some satellite-relay metadata datasets store as unix seconds.
    - release_date
    - date
    - d_date
    - de_date
    # Interval columns: these datasets have no single instant. s_date/end_date
    # are the interval bounds, so the extent is narrow by about one interval.
    - s_date
    - end_date
    # String time column (fixed-width ISO-like); compared as a string.
    - date_hour_UTC
    - timestamp
  depth:
  latitude:
    - LATITUDE
    - latitude
    - lat
    # add this for data-uplift aggregated datasets for co-index
    - decimalLatitude
    - release_latitude
    - ssm_lat
    - receiver_deployment_latitude
  longitude:
    - LONGITUDE
    - longitude
    - lon
    # add this for data-uplift aggregated datasets for co-index
    - decimalLongitude
    - release_longitude
    - ssm_lon
    - receiver_deployment_longitude
sites:
  config:
    duckdb_database: "parquet_disk_db.duckdb"
    duckdb_temp_dir: "parquet_duckdb_tmp"
    co_bucket: "aodn-cloud-optimised"
    memory_limit: "800M"
    threads: 4
    region: "ap-southeast-2"
    # Hours between cron sweeps that check each repository's S3 snapshot
    # ETag and reload it if changed (see core/scheduler.py).
    reload_interval_hours: 2
estimation:
  config:
    s3_prefix: "portal/estimation"
    output_dir: "portal/estimation/output"
    # Cell size in degrees of the single pass over the source data
    # (0.1 deg is ~11 km).
    bin_size: 0.1
    # Whole-number factors tried in order when the index has more rows than
    # max_index_rows: 5 means 0.5 deg cells. A coarser grid is re-aggregated
    # from the file already written, so a retry never re-reads S3. Must be
    # integers - that is what makes merging cells exact.
    bin_merge_factors: [1, 2, 5, 10]
    max_index_rows: 5000000
    # Bytes-per-row and zip ratio are measured from this many source files
    # (spread across the dataset) and this many rows in total.
    sample_files: 8
    sample_rows: 50000
    row_group_size: 100000
    # Request side switch. False makes estimate_size always do the live scan.
    use_index_for_estimate: True
    # True: the batch run forks one child per dataset so DuckDB memory goes
    # back to the OS on exit. False: run in the main process (local debug).
    use_fork_process: True
    # Files per chunk in the scan over the source parquet which counts rows per # day, lat cell, lon cell.
    # DuckDB frees its per-file state (parquet metadata, reader and httpfs
    # handles) only when the connection closes, not when the query ends.
    # 0 = no chunking: one scan of everything.
    chunk_files: 150000
    duckdb:
      duckdb_temp_dir: "estimation_duckdb_tmp"
      duckdb_database: "estimation_db.duckdb"
      memory_limit: "3G"
      threads: 3
      show_progress: True
      # This scan reads every file once, so the block cache can never hit.
      # Off, it drops the per-file cost from ~48 KB to ~11 KB for ~2% runtime.
      enable_external_file_cache: False
    # The read side, in the always-on API service. Its own connection, on its
    # own :memory: database - it does not share the sites client, so retuning
    # sites cannot move the estimate. The query is a streaming SUM over one
    # small parquet, so this limit is a guard rail rather than a working
    # budget: measured RSS is ~3 MB for the connection whatever it is set to.
    read_duckdb:
      memory_limit: "128MB"
      threads: 2
      region: "ap-southeast-2"
pmtiles:
  config:
    co_bucket: "aodn-cloud-optimised"
    output_pmtiles_dir: "portal/pmtiles/output"
    staged_parquet_dir: "portal/pmtiles/parquet_staged"
    geojsonseq_dir: "geojsonseq_tmp"
    duckdb_temp_dir: "duckdb_tmp"
    duckdb_database: "disk_db.duckdb"
    memory_limit: "3G"
    threads: 3
    fetch_size: 50000
    # Periodic DuckDB query progress logs (via query_progress + Python logger)
    show_progress: True
    # Temporal bucket for hexbin counts: "month" (YYYYMM) or "date" (YYYYMMDD).
    time_group_by: all
    # True: batch PMTiles generation forks one child process per parquet
    # dataset (reclaims DuckDB/tippecanoe memory on exit). False: run each
    # dataset in the main app process.
    use_fork_process: True
    # True: after all pmtiles are generated, the same job builds the estimation
    # index for the same datasets (one uuid only, when the run is filtered).
    build_estimation_index: True
  layers:
    hex_z0:
      h3_resolution: 2
      minzoom: 0
      maxzoom: 1
    hex_z2:
      h3_resolution: 3
      minzoom: 2
      maxzoom: 3
    hex_z4:
      h3_resolution: 4
      minzoom: 4
      maxzoom: 5
    hex_z6:
      h3_resolution: 6
      minzoom: 6
      maxzoom: 7
    hex_z8:
      h3_resolution: 7
      minzoom: 8
      maxzoom: 9
    hex_z10:
      h3_resolution: 8
      minzoom: 10
      maxzoom: 12
tiler:
  config:
    # Capacity gate for concurrent store opens during startup prewarm.
    store_prewarm_workers: 20
    # Hours between cron sweeps that re-open every prewarmed store to pick up
    # newly appended time steps (see core/scheduler.py). Refreshes run one
    # store at a time, so this bounds staleness, not concurrency.
    store_refresh_interval_hours: 4
    # Max concurrent sync route handlers (each cold slice needs one thread).
    thread_pool_size: 20
    # Capacity gate for /animation per-frame S3 fan-out. Sized to the aiobotocore
    animation_workers: 10
    # Cache backend for L1 (slice cache): "none" disables caching entirely.
    # "redis" shares the cache + cross-instance dedup through the Redis-protocol
    # store at redis_host/redis_port below — see memoizer.create_memoizer.
    cache_backend: "redis"
    # Per-entry TTL in seconds — unused while cache_backend is "none".
    slice_cache_ttl_seconds: 600
    # This is only for loacal, other envs will read from infra settings.
    redis_host: "localhost"
    redis_port: 6379
    # True uses anonymous access for s3:// URLs — correct for IMOS's public AODN
    # buckets. False lets fsspec discover AWS credentials for private buckets.
    s3_anon: true
    # Per-socket S3 timeouts (botocore). connect_timeout bounds DNS + TCP/TLS
    # handshake; read_timeout is per-read inactivity, not total request duration.
    s3_connect_timeout: 5
    s3_read_timeout: 30
    s3_max_attempts: 2
  # Static product-catalogue config, deliberately not overridden by any
  # config-{env}.yaml overlay — it doesn't vary by environment. Read directly
  # off this base file via Config.load_tiler_catalog_config(), bypassing the
  # per-environment merge (see services/product/discovery.py and
  # schemas/products.py for the loaders that read each section below).
  #
  # Stores to drop entirely before candidates are fanned out, keyed by the
  # suffix-stripped dataset name product_id uses (e.g.
  # "model_sea_level_anomaly_gridded_realtime", not "*.zarr") — see
  # services/product/discovery.py::discover_products.
  blacklist:
    - radar_Newcastle_velocity_hourly_averaged_delayed_qc
    - radar_Newcastle_velocity_hourly_averaged_realtime_nonqc
    - radar_TurquoiseCoast_velocity_hourly_averaged_realtime_nonqc
    - radar_CoralCoast_velocity_hourly_averaged_realtime_nonqc
    - radar_BonneyCoast_velocity_hourly_averaged_realtime_nonqc
    - radar_BonneyCoast_velocity_hourly_averaged_delayed_qc
    - radar_TurquoiseCoast_velocity_hourly_averaged_delayed_qc
    - radar_CoralCoast_velocity_hourly_averaged_delayed_qc
  # Variable specifications fanned out across the metadata catalogue at
  # startup to derive the candidate product set — see
  # services/product/discovery.py. A plain string matches a single variable;
  # a list matches an ordered pair (e.g. current vectors), which is always
  # data-only, never visual.
  gridded_variables:
    - GSLA
    - [UCUR, VCUR]
    - GSL
    - sea_surface_temperature
    - analysed_sst
    - sea_ice_fraction
    - sst
    - sst_mosaic
    - ssta
    - ssta_mosaic
    - sst_anom_mosaic
    - dhd
    - dhd_mosaic
    - dhd_count_mosaic
    - dhdc_mosaic
    - mpsa_mosaic
    - MCS_category
    - MCS_category_mosaic
    - MHW_category_mosaic
  # Per-product tuning, keyed by the derived product id (see
  # services/product/discovery.py::product_id) and applied on top of the
  # candidates gridded_variables fans out — see schemas/products.py.
  products_customisation:
    - id: model_sea_level_anomaly_gridded_realtime:gsla
      data_tile:
        coastal_fill:
          max_dist_px: 4
    - id: model_sea_level_anomaly_gridded_realtime:ucur+vcur
      ocean_masked: true
csiro:
  datasets:
    - dataset_name: uwy_csiro.parquet
      key_request_url: https://data.csiro.au/dap/api/v2/collections/72626/files/s3
